services:
  db:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: quickdesk
      POSTGRES_PASSWORD: quickdesk
      POSTGRES_DB: quickdesk
    volumes: [quickdesk-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickdesk -d quickdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://quickdesk:quickdesk@db:5432/quickdesk
      QUICKDESK_ENV: ${QUICKDESK_ENV:-dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.2-11b-vision-instruct}

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    ports: ["80:80"]
    depends_on:
      - backend

volumes:
  quickdesk-postgres:
