services:
  db:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: quickdesk
      POSTGRES_PASSWORD: quickdesk
      POSTGRES_DB: quickdesk
    volumes: [quickdesk-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickdesk -d quickdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://quickdesk:quickdesk@db:5432/quickdesk
      QUICKDESK_ENV: ${QUICKDESK_ENV:-dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    ports: ["80:80"]
    depends_on:
      - backend

volumes:
  quickdesk-postgres:
